model_lifecycle:
  managed_by_provider: true
  statement: >-
    Callers set model to "standardcompute" and the router selects the underlying
    model per request. The provider frames this as a lifecycle FEATURE: "you're
    never stuck on a deprecated model". The corollary an integrator should weigh is
    that the caller cannot pin a model version, so upstream model changes arrive
    without a client-side change and without a client-side veto.
  source: https://standardcompute.com/llms-full.txt
