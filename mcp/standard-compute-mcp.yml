candidate_input_schemas: >-
  NOT DERIVABLE. The published OpenAPI declares no requestBody and no
  components.schemas on any operation, so no real inputSchema can be produced from
  the contract. A server built from this spec would have to import the OpenAI and
  Anthropic request schemas from those upstream specifications instead.
assessment: >-
  An MCP server would be low-value here and that is worth stating plainly. This API
  is the compute an agent RUNS ON, not a tool an agent CALLS — an agent already
  reaches it through its own model-provider configuration. The one genuinely useful
  MCP tool would be a budget/usage reader, and no such endpoint exists in the public
  contract at all.
