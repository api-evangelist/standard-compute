model: >-
  Flat monthly subscription. There is no per-token meter and no overage charge.
  Each tier carries a stated monthly COMPUTE BUDGET (a dollar figure of upstream
  work); requests run at full speed until it is consumed, then the API returns
  HTTP 402 until the period renews. Optional "smart pacing" spreads the budget
  across the month instead of stopping.
