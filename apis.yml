name: Standard Compute
description: >-
  An independent, flat-rate LLM inference API for AI coding agents. OpenAI-compatible (and Anthropic Messages-co
  mpatible) single-endpoint inference/routing service that smart-routes each request to the best-fit model, sold
   as a flat monthly subscription rather than per-token billing.
url: https://raw.githubusercontent.com/api-evangelist/standard-compute/refs/heads/main/apis.yml
