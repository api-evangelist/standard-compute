  - developer tools
  - coding agents
  - openai-compatible
apis:
  - name: Standard Compute Inference API
    description: >-
      OpenAI-compatible (and Anthropic Messages-compatible) LLM inference endpoint. Set base URL to https://api.
      stdcmpt.com/v1, use a Bearer API key, and set model to 'standardcompute'. Supports POST /v1/chat/completio
      ns and an Anthropic Messages-compatible path.
    humanURL: https://standardcompute.com/getting-started
    baseURL: https://api.stdcmpt.com/v1
