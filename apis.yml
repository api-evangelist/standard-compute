name: Standard Compute
description: >-
  An independent, flat-rate LLM inference API for AI coding agents. Standard Compute
  runs a single OpenAI-compatible (and Anthropic Messages-compatible) inference
  endpoint that smart-routes each request to the best-fit model across closed
  frontier and efficient open models, sold as a flat monthly subscription with a
  stated compute budget rather than per-token billing. Integration is a base-URL
  swap: point any OpenAI-compatible agent at https://api.stdcmpt.com/v1, use a
  Bearer key, and set the model to "standardcompute". There are no per-minute 429
  walls and no 5-hour or weekly windows; requests run at full speed until the
  monthly budget is reached, then return HTTP 402 until the period renews.
