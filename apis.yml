apis:
  - name: Standard Compute Inference API
    description: >-
      OpenAI-compatible (and Anthropic Messages-compatible) LLM inference endpoint.
      Set base URL to https://api.stdcmpt.com/v1, use a Bearer API key, and set
      model to 'standardcompute'. Supports POST /v1/chat/completions,
      POST /v1/completions, POST /v1/responses, the Anthropic Messages-compatible
      POST /v1/messages and /v1/messages/count_tokens, plus an unauthenticated
      GET /v1/models.
    humanURL: https://standardcompute.com/getting-started
    baseURL: https://api.stdcmpt.com/v1
